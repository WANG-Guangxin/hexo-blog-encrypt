<div class="hbe hbe-container{{hbeContainerClass}}" id="{{hbeContainerId}}"{{hbeContainerAttribute}}
     data-hbe-format="{{hbeFormat}}"
     data-wpm="{{hbeWrongPassMessage}}"
     data-whm="{{hbeWrongHashMessage}}"
     data-salt="{{hbeSalt}}"
     data-nonce="{{hbeNonce}}"
     data-kdf-iterations="{{hbeKdfIterations}}"
     data-auto-save="{{hbeAutoSave}}">
  <script id="{{hbeDataId}}" type="{{hbeDataType}}"{{hbeDataAttribute}}>
    {{hbeEncryptedData}}
  </script>
  <div class="hbe hbe-content">
    <form id="{{hbeFormId}}" class="hbe hbe-form"{{hbeFormAttribute}} onsubmit="return false">
      <div class="hbe hbe-input hbe-input-flip">
      <input class="hbe hbe-input-field hbe-input-field-flip{{hbeInputClass}}" type="password" id="{{hbeInputId}}">
      <label class="hbe hbe-input-label hbe-input-label-flip" for="{{hbeInputId}}">
        <span class="hbe hbe-input-label-content hbe-input-label-content-flip" data-content="{{hbeMessage}}">{{hbeMessage}}</span>
      </label>
    </div>
      <button class="hbe hbe-button{{hbeButtonClass}}" type="submit">{{hbeButtonText}}</button>
      <div class="hbe hbe-error" role="alert" aria-live="polite"></div>
    </form>
  </div>
</div>
